# Termux properties — see https://wiki.termux.com/wiki/Terminal_Settings
# Run `termux-reload-settings` after changes.

### Extra keys (two-row layout)
extra-keys = [['ESC','/','-','HOME','UP','END','PGUP'], \
              ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]

### Some phone keyboards show no letters until Enter is pressed — uncomment to fix
# enforce-char-based-input = true

### Scrollback buffer (default ~2000, max 50000)
# terminal-transcript-rows = 5000

### Back key sends ESC (useful for vim/nano) instead of hiding keyboard
# back-key = escape

### Silence terminal bells (default: vibrate)
# bell-character = ignore

### Force AMOLED black for drawer and dialogs
# use-black-ui = true

### Disable toast on terminal session change
# disable-terminal-session-change-toast = true
