  'curl(\s.*)?',
  'eval(\s.*)?',
  'source(\s.*)?',
  'rm(\s.*)?',
  'wget(\s.*)?',
]
computer_use = "never"
directory_allowlist = []
execute_commands = "agent_decides"
mcp_allowlist = []
mcp_denylist = []
mcp_permissions = "agent_decides"
name = "Default"
read_files = "agent_decides"
run_agents = "always_ask"
web_search_enabled = true
write_to_pty = "always_allow"

